name: Bug
description: Something in the repository is wrong or does not build.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, or the page and the steps.
      render: shell
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version or commit

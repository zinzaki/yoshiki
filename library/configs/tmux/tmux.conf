# ╭─ tmux ─ quiet status, gold seams ───
# │  hex values mirror canon/palettes/night-beige; keep them in sync
# ╰╴
set -g status-style              "bg=#0B0A08,fg=#9A9584"
set -g status-justify            left

# ── left — a gold mark + session name ──
set -g status-left               " ◆ #S   "
set -g status-left-style         "fg=#D8AF52"

# ── windows — active in bone, rest dim; selection by color, not brackets ──
set -g window-status-format         " #W "
set -g window-status-current-format " #W "
set -g window-status-current-style  "fg=#D6D2BD"
set -g window-status-style          "fg=#7E7A6E"

# ── right — the clock, dim gold, quiet ──
set -g status-right              "#[fg=#B5924A]%H:%M "

# ── pane borders — hairline; active edge gilded ──
set -g pane-border-style         "fg=#3A362E"
set -g pane-active-border-style  "fg=#B5924A"

# ── silence ──
set -g visual-bell off
set -g monitor-bell off

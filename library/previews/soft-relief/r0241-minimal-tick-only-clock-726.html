<div class="pv pv-r0241-minimal-tick-only-clock-726">
  <div class="face">
    <span class="tick t9"></span><span class="tick t3"></span>
    <span class="hand hr"></span><span class="hand mn"></span>
  </div>
  <style>
    .pv-r0241-minimal-tick-only-clock-726{
      width:100%;height:100%;box-sizing:border-box;overflow:hidden;background:var(--panel);
      display:flex;align-items:center;justify-content:center;
    }
    .pv-r0241-minimal-tick-only-clock-726 .face{
      width:140px;height:140px;border-radius:50%;position:relative;background:var(--panel);
      box-shadow:8px 8px 16px color-mix(in srgb, var(--bg) 55%, black),
                 -8px -8px 16px color-mix(in srgb, var(--raised) 75%, white 25%);
    }
    .pv-r0241-minimal-tick-only-clock-726 .tick{position:absolute;width:8px;height:2px;background:var(--mu);top:50%;margin-top:-1px}
    .pv-r0241-minimal-tick-only-clock-726 .t9{left:10px}
    .pv-r0241-minimal-tick-only-clock-726 .t3{right:10px}
    .pv-r0241-minimal-tick-only-clock-726 .hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;background:var(--ink)}
    .pv-r0241-minimal-tick-only-clock-726 .hr{width:3px;height:34px;transform:translateX(-50%) rotate(50deg)}
    .pv-r0241-minimal-tick-only-clock-726 .mn{width:2px;height:52px;transform:translateX(-50%) rotate(160deg);background:var(--acc)}
  </style>
</div>

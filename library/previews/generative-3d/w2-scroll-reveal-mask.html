<div class="pv pv-w2-scroll-reveal-mask">
  <div class="tile t1"><span class="lbl">28%</span></div>
  <div class="tile t2"><span class="lbl">64%</span></div>
  <div class="tile t3"><span class="lbl">96%</span></div>
  <style>
    .pv-w2-scroll-reveal-mask{ width:100%; height:100%; box-sizing:border-box; background:var(--bg); display:flex; align-items:flex-end; gap:14px; padding:18px; }
    .pv-w2-scroll-reveal-mask .tile{ position:relative; flex:1; height:180px; border:1px solid var(--line); border-radius:6px; background:linear-gradient(155deg, var(--raised), var(--hover)); -webkit-mask-image:linear-gradient(to top, black var(--r), transparent calc(var(--r) + 22%)); mask-image:linear-gradient(to top, black var(--r), transparent calc(var(--r) + 22%)); }
    .pv-w2-scroll-reveal-mask .t1{ --r:28%; }
    .pv-w2-scroll-reveal-mask .t2{ --r:64%; }
    .pv-w2-scroll-reveal-mask .t3{ --r:96%; }
    .pv-w2-scroll-reveal-mask .lbl{ position:absolute; left:6px; bottom:6px; font:9px var(--mono); color:var(--mu); background:var(--panel); border:1px solid var(--line); padding:1px 5px; border-radius:4px; }
  </style>
</div>

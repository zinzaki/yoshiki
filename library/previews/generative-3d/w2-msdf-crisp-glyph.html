<div class="pv pv-w2-msdf-crisp-glyph">
  <div class="big">
    <span class="fill">G</span>
    <span class="contour">G</span>
  </div>
  <div class="small">
    <span class="fill">G</span>
  </div>
  <span class="cap">MSDF · rendered from one field, any size</span>
  <style>
    .pv-w2-msdf-crisp-glyph{ position:relative; width:100%; height:100%; background:var(--bg); font-family:var(--disp); }
    .pv-w2-msdf-crisp-glyph .big{ position:absolute; left:24px; top:6px; width:180px; height:180px; }
    .pv-w2-msdf-crisp-glyph .big span{ position:absolute; inset:0; font-size:170px; line-height:1; display:flex; align-items:center; justify-content:center; }
    .pv-w2-msdf-crisp-glyph .big .fill{ color:var(--head); }
    /* the distance-field edge, shown as an offset contour line around the same glyph */
    .pv-w2-msdf-crisp-glyph .big .contour{ color:transparent; -webkit-text-stroke:1.5px var(--acc); text-stroke:1.5px var(--acc); }
    .pv-w2-msdf-crisp-glyph .small{ position:absolute; right:26px; bottom:26px; width:42px; height:42px; }
    .pv-w2-msdf-crisp-glyph .small .fill{ font-size:38px; color:var(--head); line-height:1; }
    .pv-w2-msdf-crisp-glyph .cap{ position:absolute; left:24px; bottom:14px; font:10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mu); }
  </style>
</div>

<div class="pv pv-r0137-floating-metric-card-with-avatar-footer-454">
  <div class="card">
    <div class="hd"><span>ENDURANCE</span><i class="chev"></i></div>
    <div class="glyph">C</div>
    <div class="ft">
      <span class="av"></span>
      <span class="nm">2B</span>
      <span class="pc">92%</span>
    </div>
  </div>
  <style>
    .pv-r0137-floating-metric-card-with-avatar-footer-454{
      width:100%;height:100%;box-sizing:border-box;overflow:hidden;background:var(--bg);
      display:flex;align-items:center;justify-content:center;font-family:var(--ui);
    }
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .card{
      width:150px;height:110px;background:var(--panel);border:1px solid var(--line);
      clip-path:polygon(0 0,100% 0,100% 84%,84% 100%,0 100%);
      padding:12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;
    }
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .hd{
      display:flex;justify-content:space-between;align-items:center;
      font:600 9px var(--mono);letter-spacing:.1em;color:var(--mu);
    }
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .chev{
      width:6px;height:6px;border-top:1px solid var(--acc);border-right:1px solid var(--acc);
      transform:rotate(45deg);
    }
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .glyph{
      font:700 34px var(--disp);color:var(--acc);text-align:center;line-height:1;
    }
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .ft{
      display:flex;align-items:center;gap:6px;
    }
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .av{
      width:16px;height:16px;border-radius:50%;background:var(--hover);border:1px solid var(--strong);
    }
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .nm{font:500 11px var(--ui);color:var(--ink);flex:1}
    .pv-r0137-floating-metric-card-with-avatar-footer-454 .pc{font:600 11px var(--mono);color:var(--acc)}
  </style>
</div>

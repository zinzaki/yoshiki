<div class="pv pv-w2-background-beams">
  <div class="beam b1"></div>
  <div class="beam b2"></div>
  <div class="beam b3"></div>
  <div class="grid"></div>
  <span class="cap">field scan · idle</span>
  <style>
    .pv-w2-background-beams{ position:relative; width:100%; height:100%; background:var(--bg); overflow:hidden; box-sizing:border-box; }
    .pv-w2-background-beams .grid{ position:absolute; inset:0; background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% 22px; opacity:.25; }
    .pv-w2-background-beams .beam{ position:absolute; left:-40%; width:180%; height:46px; background:linear-gradient(90deg, transparent, var(--acc) 45%, transparent); opacity:.14; transform:rotate(-16deg); filter:blur(7px); animation:pv-w2-beams-drift 7s ease-in-out infinite; }
    .pv-w2-background-beams .b1{ top:8%; animation-delay:0s; }
    .pv-w2-background-beams .b2{ top:42%; opacity:.1; animation-delay:-2.4s; }
    .pv-w2-background-beams .b3{ top:76%; opacity:.08; animation-delay:-4.8s; }
    @keyframes pv-w2-beams-drift{ 0%,100%{ transform:rotate(-16deg) translateX(0); } 50%{ transform:rotate(-16deg) translateX(3%); } }
    @media (prefers-reduced-motion: reduce){ .pv-w2-background-beams .beam{ animation:none; } }
    .pv-w2-background-beams .cap{ position:absolute; left:16px; bottom:14px; font:10px var(--mono); letter-spacing:.06em; color:var(--mu); text-transform:uppercase; }
  </style>
</div>

<div class="pv pv-w2-animated-beam-connector">
  <svg viewBox="0 0 360 230" width="100%" height="100%">
    <path class="base" d="M70 176 C 150 66, 210 190, 296 60" fill="none" pathLength="100"></path>
    <path class="head" d="M70 176 C 150 66, 210 190, 296 60" fill="none" pathLength="100"></path>
  </svg>
  <div class="node n1">Ingest</div>
  <div class="node n2">Cache</div>
  <style>
    .pv-w2-animated-beam-connector{ position:relative; width:100%; height:100%; background:var(--bg); overflow:hidden; box-sizing:border-box; font-family:var(--ui); }
    .pv-w2-animated-beam-connector svg{ position:absolute; inset:0; }
    .pv-w2-animated-beam-connector .base{ stroke:var(--line); stroke-width:1.5; stroke-dasharray:2.5 4; }
    .pv-w2-animated-beam-connector .head{ stroke:var(--acc); stroke-width:3; stroke-linecap:round; stroke-dasharray:14 400; stroke-dashoffset:34; filter:drop-shadow(0 0 4px var(--acc)); animation:pv-w2-abc-travel 2.8s linear infinite; }
    @keyframes pv-w2-abc-travel{ from{ stroke-dashoffset:40; } to{ stroke-dashoffset:-370; } }
    @media (prefers-reduced-motion: reduce){ .pv-w2-animated-beam-connector .head{ animation:none; stroke-dashoffset:34; } }
    .pv-w2-animated-beam-connector .node{ position:absolute; transform:translate(-50%,-50%); background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:11px; color:var(--ink); }
    .pv-w2-animated-beam-connector .n1{ left:70px; top:176px; }
    .pv-w2-animated-beam-connector .n2{ left:296px; top:60px; border-color:var(--acc); color:var(--head); font-weight:600; }
  </style>
</div>

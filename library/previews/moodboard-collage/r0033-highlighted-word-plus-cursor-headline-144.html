<div class="pv pv-r0033-highlighted-word-plus-cursor-headline-144">
  <div class="hl">
    <span class="ser">Writing is</span> <span class="mark">thinking</span><br>
    <span class="sans">out loud, in public.<span class="cur"></span></span>
  </div>
  <style>
    .pv-r0033-highlighted-word-plus-cursor-headline-144{
      width:100%;height:100%;box-sizing:border-box;overflow:hidden;background:var(--bg);
      display:flex;align-items:center;padding:20px;
    }
    .pv-r0033-highlighted-word-plus-cursor-headline-144 .hl{font-size:24px;line-height:1.35;color:var(--head)}
    .pv-r0033-highlighted-word-plus-cursor-headline-144 .ser{font-family:var(--disp);font-style:italic}
    .pv-r0033-highlighted-word-plus-cursor-headline-144 .sans{font-family:var(--ui);font-weight:600}
    .pv-r0033-highlighted-word-plus-cursor-headline-144 .mark{
      font-family:var(--ui);font-weight:700;background:var(--acc);color:var(--bg);padding:0 6px;
    }
    .pv-r0033-highlighted-word-plus-cursor-headline-144 .cur{
      display:inline-block;width:3px;height:20px;background:var(--acc);margin-left:4px;
      vertical-align:middle;animation:pv-r0033-blink 1s steps(1) infinite;
    }
    @media (prefers-reduced-motion: reduce){
      .pv-r0033-highlighted-word-plus-cursor-headline-144 .cur{animation:none}
    }
    @keyframes pv-r0033-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  </style>
</div>

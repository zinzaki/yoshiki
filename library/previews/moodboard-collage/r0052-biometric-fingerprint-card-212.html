<div class="pv pv-r0052-biometric-fingerprint-card-212">
  <div class="card">
    <div class="hl">Efficient<br>Biometrics</div>
    <div class="chips">
      <span class="chip">◠</span><span class="chip">✦</span><span class="chip">◉</span>
    </div>
    <div class="fp">
      <span class="glow"></span>
      <span class="arc a1"></span><span class="arc a2"></span><span class="arc a3"></span><span class="arc a4"></span>
    </div>
  </div>
  <style>
    .pv-r0052-biometric-fingerprint-card-212{
      width:100%;height:100%;box-sizing:border-box;overflow:hidden;background:var(--bg);
      display:flex;align-items:stretch;font-family:var(--ui);
    }
    .pv-r0052-biometric-fingerprint-card-212 .card{
      width:100%;padding:16px;box-sizing:border-box;position:relative;
      display:flex;flex-direction:column;
    }
    .pv-r0052-biometric-fingerprint-card-212 .hl{
      font:700 16px/1.2 var(--ui);color:var(--head);
    }
    .pv-r0052-biometric-fingerprint-card-212 .chips{display:flex;gap:8px;margin-top:12px}
    .pv-r0052-biometric-fingerprint-card-212 .chip{
      width:26px;height:26px;border-radius:50%;background:var(--raised);border:1px solid var(--line);
      display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mu);
    }
    .pv-r0052-biometric-fingerprint-card-212 .fp{
      position:absolute;right:22px;bottom:8px;width:96px;height:96px;
      display:flex;align-items:center;justify-content:center;
    }
    .pv-r0052-biometric-fingerprint-card-212 .glow{
      position:absolute;inset:-10px;border-radius:50%;
      background:radial-gradient(circle, color-mix(in srgb, var(--acc) 45%, transparent), transparent 70%);
    }
    .pv-r0052-biometric-fingerprint-card-212 .arc{
      position:absolute;border:2px solid var(--acc);border-radius:50%;border-color:var(--acc) var(--acc) transparent transparent;
    }
    .pv-r0052-biometric-fingerprint-card-212 .a1{width:88px;height:88px;transform:rotate(20deg)}
    .pv-r0052-biometric-fingerprint-card-212 .a2{width:68px;height:68px;transform:rotate(140deg);opacity:.85}
    .pv-r0052-biometric-fingerprint-card-212 .a3{width:48px;height:48px;transform:rotate(260deg);opacity:.7}
    .pv-r0052-biometric-fingerprint-card-212 .a4{width:28px;height:28px;transform:rotate(40deg);opacity:.55}
  </style>
</div>

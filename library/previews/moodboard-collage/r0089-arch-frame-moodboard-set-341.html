<div class="pv pv-r0089-arch-frame-moodboard-set-341">
  <div class="card arch"><i class="tick"></i></div>
  <div class="card dome"><i class="tick"></i></div>
  <div class="card blob"><i class="dot"></i></div>
  <div class="card rect"><i class="dot"></i></div>
  <style>
  .pv-r0089-arch-frame-moodboard-set-341{width:100%;height:100%;box-sizing:border-box;background:#0e0d0a;padding:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
  .pv-r0089-arch-frame-moodboard-set-341 .card{position:relative;background:linear-gradient(150deg,var(--raised),var(--hover))}

  .pv-r0089-arch-frame-moodboard-set-341 .dome{border-radius:50% 50% 4px 4px}
  .pv-r0089-arch-frame-moodboard-set-341 .blob{border-radius:60% 40% 55% 45%/50% 55% 45% 50%}

  </style>
</div>

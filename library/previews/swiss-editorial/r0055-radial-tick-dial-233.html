<div class="pv pv-r0055-radial-tick-dial-233">
  <div class="dial"></div>
  <div class="hand"></div>
  <div class="glyph"></div>
  <style>
    .pv-r0055-radial-tick-dial-233{ position:relative; width:100%; height:100%; background:var(--panel); overflow:hidden; box-sizing:border-box; display:flex; align-items:center; justify-content:center; }
    .pv-r0055-radial-tick-dial-233 .dial{ width:150px; height:150px; border-radius:50%; background:repeating-conic-gradient(var(--ink) 0deg 1deg, transparent 1deg 9deg); -webkit-mask-image:radial-gradient(circle, transparent 62%, black 63%, black 100%); mask-image:radial-gradient(circle, transparent 62%, black 63%, black 100%); }

    .pv-r0055-radial-tick-dial-233 .glyph::after{ left:0; top:4px; width:10px; height:2px; }

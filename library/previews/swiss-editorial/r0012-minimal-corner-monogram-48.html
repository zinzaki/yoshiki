<div class="pv pv-r0012-minimal-corner-monogram-48">
  <div class="crop tl"></div>
  <div class="crop tr"></div>
  <div class="crop bl"></div>
  <div class="crop br"></div>
  <span class="mono">N/+</span>
  <style>
    .pv-r0012-minimal-corner-monogram-48{ position:relative; width:100%; height:100%; background:var(--panel); overflow:hidden; box-sizing:border-box; }
    .pv-r0012-minimal-corner-monogram-48 .crop{ position:absolute; width:14px; height:14px; opacity:.5; }
    .pv-r0012-minimal-corner-monogram-48 .crop::before,.pv-r0012-minimal-corner-monogram-48 .crop::after{ content:""; position:absolute; background:var(--strong); }
    .pv-r0012-minimal-corner-monogram-48 .crop::before{ top:0; left:0; width:1px; height:14px; }
    .pv-r0012-minimal-corner-monogram-48 .crop::after{ top:0; left:0; width:14px; height:1px; }

    .pv-r0012-minimal-corner-monogram-48 .tr{ right:16px; top:16px; transform:scaleX(-1); }
    .pv-r0012-minimal-corner-monogram-48 .bl{ left:16px; bottom:16px; transform:scaleY(-1); }
    .pv-r0012-minimal-corner-monogram-48 .br{ right:16px; bottom:16px; transform:scale(-1,-1); }
    .pv-r0012-minimal-corner-monogram-48 .mono{ position:absolute; right:18px; bottom:16px; font:14px var(--ui); letter-spacing:.02em; color:var(--ink); }

<div class="pv pv-w2-bento-named-grid">
  <div class="grid">
    <div class="cell hero"><span>Overview</span></div>
    <div class="cell tall"><span>Timeline</span></div>
    <div class="cell"><span>Team</span></div>
    <div class="cell"><span>Budget</span></div>
    <div class="cell wide"><span>Notes</span></div>
  </div>
  <style>
    .pv-w2-bento-named-grid{ width:100%; height:100%; background:var(--bg); padding:14px; box-sizing:border-box; font-family:var(--ui); }
    .pv-w2-bento-named-grid .grid{ width:100%; height:100%; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr); gap:6px; }
    .pv-w2-bento-named-grid .cell{ background:var(--panel); border:1px solid var(--line); display:flex; align-items:flex-end; padding:8px; }
    .pv-w2-bento-named-grid .cell span{ font:600 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mu); }
    .pv-w2-bento-named-grid .hero{ grid-column:1 / 3; grid-row:1 / 3; background:var(--raised); }
    .pv-w2-bento-named-grid .hero span{ color:var(--head); font-size:12px; }
    .pv-w2-bento-named-grid .tall{ grid-column:3 / 4; grid-row:1 / 3; }
    .pv-w2-bento-named-grid .wide{ grid-column:1 / 4; grid-row:3 / 4; }
  </style>
</div>

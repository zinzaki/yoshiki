<div class="pv pv-w2-squircle-fab">
  <div class="photo"></div>
  <div class="pair">
    <div class="col">
      <div class="fab rest">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="lbl">resting</span>
    </div>
    <div class="col">
      <div class="fab pressed">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <span class="lbl">pressed</span>
    </div>
  </div>
  <style>
    .pv-w2-squircle-fab{ width:100%; height:100%; position:relative; display:flex; align-items:center; justify-content:center; font-family:var(--ui); overflow:hidden; }
    .pv-w2-squircle-fab .photo{ position:absolute; inset:0; background:conic-gradient(from 210deg at 55% 35%, var(--raised), var(--panel), var(--strong), var(--panel)); box-shadow:inset 0 0 60px rgba(0,0,0,.18); }
    .pv-w2-squircle-fab .pair{ position:relative; z-index:2; display:flex; gap:44px; align-items:center; }
    .pv-w2-squircle-fab .col{ display:flex; flex-direction:column; align-items:center; gap:10px; }
    .pv-w2-squircle-fab .fab{ width:64px; height:64px; border-radius:38% 62% 40% 60% / 55% 45% 55% 45%; background:color-mix(in srgb, var(--panel) 55%, transparent); backdrop-filter:blur(10px); border:1px solid color-mix(in srgb, var(--strong) 70%, transparent); display:flex; align-items:center; justify-content:center; box-shadow:0 12px 26px rgba(0,0,0,.28); }
    .pv-w2-squircle-fab .fab svg{ width:22px; height:22px; stroke:var(--ink); fill:none; }
    .pv-w2-squircle-fab .pressed{ transform:scale(.92); box-shadow:0 4px 10px rgba(0,0,0,.24) inset, 0 4px 10px rgba(0,0,0,.2); background:color-mix(in srgb, var(--panel) 75%, transparent); }
    .pv-w2-squircle-fab .lbl{ font:500 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--head); }
  </style>
</div>

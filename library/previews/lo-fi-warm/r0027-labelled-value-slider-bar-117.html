<div class="pv pv-r0027-labelled-value-slider-bar-117">
  <div class="pill">
    <span class="lbl">Ambient warmth</span>
    <span class="track">
      <i class="dot" style="--n:0"></i><i class="dot" style="--n:1"></i><i class="dot" style="--n:2"></i>
      <i class="dot" style="--n:3"></i><i class="dot" style="--n:4"></i><i class="dot" style="--n:5"></i>
      <i class="dot" style="--n:6"></i><i class="dot" style="--n:7"></i><i class="dot" style="--n:8"></i>
      <i class="dot" style="--n:9"></i><i class="dot" style="--n:10"></i><i class="dot" style="--n:11"></i>
      <span class="handle"></span>
    </span>
    <span class="val">64%</span>
  </div>
  <style>
    .pv-r0027-labelled-value-slider-bar-117{
      width:100%;height:100%;box-sizing:border-box;overflow:hidden;background:var(--bg);
      display:flex;align-items:center;justify-content:center;font-family:var(--ui);
    }
    .pv-r0027-labelled-value-slider-bar-117 .pill{
      width:320px;height:46px;border-radius:23px;background:color-mix(in srgb, var(--panel) 75%, transparent);
      backdrop-filter:blur(6px);display:flex;align-items:center;gap:10px;padding:0 16px;box-sizing:border-box;
      border:1px solid var(--line);
    }
    .pv-r0027-labelled-value-slider-bar-117 .lbl{font:12px var(--ui);color:var(--mu);white-space:nowrap}
    .pv-r0027-labelled-value-slider-bar-117 .track{flex:1;position:relative;height:12px;display:flex;align-items:center;justify-content:space-between}
    .pv-r0027-labelled-value-slider-bar-117 .dot{width:3px;height:3px;border-radius:50%;background:var(--strong)}
    .pv-r0027-labelled-value-slider-bar-117 .handle{
      position:absolute;left:64%;top:50%;transform:translate(-50%,-50%);width:2px;height:18px;background:var(--acc);
    }
    .pv-r0027-labelled-value-slider-bar-117 .val{font:600 12px var(--mono);color:var(--head)}
  </style>
</div>

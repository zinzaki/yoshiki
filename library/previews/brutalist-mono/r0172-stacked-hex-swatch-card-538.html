<div class="pv pv-r0172-stacked-hex-swatch-card-538">
  <div class="fan">
    <div class="band b1"><span>#2B140C</span></div>
    <div class="band b2"><span>#8A2B12</span></div>
    <div class="band b3"><span>#E3001B</span></div>
    <div class="band b4 light"><span>#FFFFFF</span><em>92%</em></div>
    <div class="band b5 dark"><span>#000000</span><em>78%</em></div>
  </div>
  <style>
    .pv-r0172-stacked-hex-swatch-card-538{
      width:100%;height:100%;box-sizing:border-box;overflow:hidden;background:var(--bg);
      display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    }
    .pv-r0172-stacked-hex-swatch-card-538 .fan{width:200px;height:200px;position:relative}
    .pv-r0172-stacked-hex-swatch-card-538 .band{
      position:absolute;left:0;right:0;height:52px;border-radius:8px 8px 0 0;
      display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box;
      border:1px solid var(--strong);
    }
    /* literal hex values: the piece IS a hex-reveal swatch, values are the content */
    .pv-r0172-stacked-hex-swatch-card-538 .b1{top:0;background:#2B140C;z-index:5}
    .pv-r0172-stacked-hex-swatch-card-538 .b2{top:32px;background:#8A2B12;z-index:4}
    .pv-r0172-stacked-hex-swatch-card-538 .b3{top:64px;background:var(--sig);z-index:3}
    .pv-r0172-stacked-hex-swatch-card-538 .b4{top:96px;background:#fff;z-index:2}
    .pv-r0172-stacked-hex-swatch-card-538 .b5{top:128px;background:#000;z-index:1}
    .pv-r0172-stacked-hex-swatch-card-538 .band span{font:600 13px var(--mono);color:var(--head)}
    .pv-r0172-stacked-hex-swatch-card-538 .b4 span, .pv-r0172-stacked-hex-swatch-card-538 .b4 em{color:#111}
    .pv-r0172-stacked-hex-swatch-card-538 .b5 span, .pv-r0172-stacked-hex-swatch-card-538 .b5 em{color:#eee}
    .pv-r0172-stacked-hex-swatch-card-538 .band em{font:11px var(--mono);color:var(--mu);font-style:normal}
  </style>
</div>

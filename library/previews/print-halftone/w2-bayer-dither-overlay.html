<div class="pv pv-w2-bayer-dither-overlay">
  <div class="ramp">
    <span class="band s1"></span>
    <span class="band s2"></span>
    <span class="band s3"></span>
    <span class="band s4"></span>
    <span class="band s5"></span>
  </div>
  <div class="matrix">
    <span>0</span><span>8</span><span>2</span><span>10</span>
    <span>12</span><span>4</span><span>14</span><span>6</span>
    <span>3</span><span>11</span><span>1</span><span>9</span>
    <span>15</span><span>7</span><span>13</span><span>5</span>
  </div>
  <span class="cap">ordered dither · 4×4 threshold map</span>
  <style>
    .pv-w2-bayer-dither-overlay{ position:relative; width:100%; height:100%; background:var(--bg); box-sizing:border-box; padding:16px; font-family:var(--ui); }
    .pv-w2-bayer-dither-overlay .ramp{ display:flex; width:100%; height:96px; border:1px solid var(--line); overflow:hidden; }
    .pv-w2-bayer-dither-overlay .band{ flex:1; background-color:var(--panel); background-image:radial-gradient(var(--ink) 1px, transparent 1.4px); background-position:0 0, 3px 3px; }
    .pv-w2-bayer-dither-overlay .s1{ background-size:14px 14px; opacity:.28; }
    .pv-w2-bayer-dither-overlay .s2{ background-size:10px 10px; opacity:.42; }
    .pv-w2-bayer-dither-overlay .s3{ background-size:7px 7px; opacity:.58; }
    .pv-w2-bayer-dither-overlay .s4{ background-size:5px 5px; opacity:.75; }
    .pv-w2-bayer-dither-overlay .s5{ background-size:3.5px 3.5px; opacity:.92; }
    .pv-w2-bayer-dither-overlay .matrix{ position:absolute; right:16px; top:16px; width:76px; display:grid; grid-template-columns:repeat(4,1fr); background:var(--raised); border:1px solid var(--line); }
    .pv-w2-bayer-dither-overlay .matrix span{ text-align:center; font:9px var(--mono); color:var(--mu); padding:3px 0; }
    .pv-w2-bayer-dither-overlay .cap{ position:absolute; left:16px; bottom:14px; font:10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mu); }
  </style>
</div>

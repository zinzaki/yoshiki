<div class="pv pv-w2-retro-palette-dither">
  <!-- each swatch is a fixed, named hardware palette (Game Boy green, e-ink grey, VGA 16-colour, 1-bit dither) — the point is the literal colour system, not the theme -->
  <div class="sw g4">
    <div class="scene"><span class="sky"></span><span class="sun"></span><span class="hill"></span></div>
    <span class="lbl">4-tone green</span>
  </div>
  <div class="sw g4gr">
    <div class="scene"><span class="sky"></span><span class="sun"></span><span class="hill"></span></div>
    <span class="lbl">4-tone grey</span>
  </div>
  <div class="sw c16">
    <div class="scene"><span class="sky"></span><span class="sun"></span><span class="hill"></span></div>
    <span class="lbl">16-colour</span>
  </div>
  <div class="sw c2">
    <div class="scene"><span class="sky"></span><span class="sun"></span><span class="hill dith"></span></div>
    <span class="lbl">2-bit dither</span>
  </div>
  <style>
    .pv-w2-retro-palette-dither{ width:100%; height:100%; box-sizing:border-box; background:var(--bg); padding:14px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px 10px; }
    .pv-w2-retro-palette-dither .sw{ display:flex; flex-direction:column; gap:4px; }
    .pv-w2-retro-palette-dither .scene{ position:relative; flex:1; border-radius:4px; overflow:hidden; border:1px solid var(--line); }
    .pv-w2-retro-palette-dither .scene span{ position:absolute; display:block; }
    .pv-w2-retro-palette-dither .sky{ inset:0; }
    .pv-w2-retro-palette-dither .sun{ width:18px; height:18px; border-radius:50%; left:14px; top:9px; }
    .pv-w2-retro-palette-dither .hill{ left:0; right:0; bottom:0; height:55%; clip-path:polygon(0 100%, 0 60%, 45% 15%, 75% 45%, 100% 20%, 100% 100%); }

    .pv-w2-retro-palette-dither .g4 .sky{ background:#9bbc0f; }
    .pv-w2-retro-palette-dither .g4 .sun{ background:#0f380f; }
    .pv-w2-retro-palette-dither .g4 .hill{ background:#306230; }

    .pv-w2-retro-palette-dither .g4gr .sky{ background:#e6e6e6; }
    .pv-w2-retro-palette-dither .g4gr .sun{ background:#1a1a1a; }
    .pv-w2-retro-palette-dither .g4gr .hill{ background:#999999; }

    .pv-w2-retro-palette-dither .c16 .sky{ background:#5c6bc0; }
    .pv-w2-retro-palette-dither .c16 .sun{ background:#ffd54f; }
    .pv-w2-retro-palette-dither .c16 .hill{ background:#66bb6a; }

    .pv-w2-retro-palette-dither .c2 .sky{ background:#ffffff; }
    .pv-w2-retro-palette-dither .c2 .sun{ background:#000000; border-radius:50%; }
    .pv-w2-retro-palette-dither .c2 .hill.dith{ background-color:#000000; background-image:conic-gradient(#fff 90deg, #000 90deg 180deg, #fff 180deg 270deg, #000 270deg); background-size:3px 3px; }

    .pv-w2-retro-palette-dither .lbl{ font:9px var(--mono); color:var(--mu); text-align:center; }
  </style>
</div>

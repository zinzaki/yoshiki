<div class="pv pv-w2-sheet-modal-drag">
  <div class="backdrop">
    <span class="row"></span><span class="row"></span><span class="row"></span>
  </div>
  <div class="dim"></div>
  <div class="sheet">
    <span class="handle"></span>
    <span class="hint">↑ drag to expand</span>
    <div class="line l1"></div>
    <div class="line l2"></div>
  </div>
  <style>
    .pv-w2-sheet-modal-drag{ position:relative; width:100%; height:100%; background:var(--bg); overflow:hidden; font-family:var(--ui); }
    .pv-w2-sheet-modal-drag .backdrop{ position:absolute; inset:0; padding:18px; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; }
    .pv-w2-sheet-modal-drag .row{ height:14px; border-radius:4px; background:var(--panel); }
    .pv-w2-sheet-modal-drag .row:nth-child(2){ width:70%; }
    .pv-w2-sheet-modal-drag .row:nth-child(3){ width:85%; }
    .pv-w2-sheet-modal-drag .dim{ position:absolute; inset:0; background:color-mix(in srgb, var(--bg) 55%, transparent); }
    .pv-w2-sheet-modal-drag .sheet{ position:absolute; left:0; right:0; bottom:0; top:64px; background:var(--raised); border-radius:18px 18px 0 0; box-shadow:0 -10px 24px color-mix(in srgb, var(--ink) 12%, transparent); padding:12px 18px; box-sizing:border-box; }
    .pv-w2-sheet-modal-drag .handle{ display:block; width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
    .pv-w2-sheet-modal-drag .hint{ display:block; text-align:center; font-size:10px; color:var(--acc); margin-bottom:14px; }
    .pv-w2-sheet-modal-drag .line{ height:10px; border-radius:4px; background:var(--panel); margin-bottom:8px; }
    .pv-w2-sheet-modal-drag .l2{ width:60%; }
  </style>
</div>

<div class="pv pv-w2-otp-digit-input">
  <div class="row">
    <div class="box filled">4</div>
    <div class="box filled">9</div>
    <div class="box filled">2</div>
    <div class="box focus"><span class="caret"></span></div>
    <div class="box empty"></div>
    <div class="box error">7</div>
  </div>
  <span class="msg">code is incorrect — check digit 6</span>
  <style>
    .pv-w2-otp-digit-input{ width:100%; height:100%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-family:var(--ui); box-sizing:border-box; }
    .pv-w2-otp-digit-input .row{ display:flex; gap:8px; }
    .pv-w2-otp-digit-input .box{ width:36px; height:44px; border-radius:9px; background:var(--panel); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font:600 18px var(--mono); color:var(--ink); }
    .pv-w2-otp-digit-input .focus{ border-color:var(--acc); box-shadow:0 0 0 3px var(--accT); }
    .pv-w2-otp-digit-input .caret{ width:2px; height:20px; background:var(--acc); animation:pv-w2-otp-blink 1s step-end infinite; }
    .pv-w2-otp-digit-input .empty{ border-style:dashed; }
    .pv-w2-otp-digit-input .error{ border-color:var(--sig); color:var(--sigT); background:var(--panel); }
    .pv-w2-otp-digit-input .msg{ font-size:11px; color:var(--sigT); }
    @keyframes pv-w2-otp-blink{ 0%,50%{ opacity:1; } 51%,100%{ opacity:0; } }
    @media (prefers-reduced-motion: reduce){ .pv-w2-otp-digit-input .caret{ animation:none; } }
  </style>
</div>

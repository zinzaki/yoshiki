<div class="pv pv-w2-timeline-pulse-nodes">
  <div class="line"></div>
  <div class="entry">
    <span class="node done"></span>
    <div class="text"><b>Order placed</b><span>Sep 12, 09:04</span></div>
  </div>
  <div class="entry">
    <span class="node active"><span class="ring"></span></span>
    <div class="text"><b>Out for delivery</b><span>Sep 20, 11:20</span></div>
  </div>
  <div class="entry">
    <span class="node pending"></span>
    <div class="text muted"><b>Delivered</b><span>estimated Sep 21</span></div>
  </div>
  <style>
    .pv-w2-timeline-pulse-nodes{ width:100%; height:100%; background:var(--bg); position:relative; box-sizing:border-box; padding:18px 18px 18px 30px; font-family:var(--ui); display:flex; flex-direction:column; justify-content:center; gap:20px; }
    .pv-w2-timeline-pulse-nodes .line{ position:absolute; left:35px; top:26px; bottom:26px; width:2px; background:linear-gradient(180deg, var(--acc), var(--line)); }
    .pv-w2-timeline-pulse-nodes .entry{ position:relative; display:flex; align-items:center; gap:14px; }
    .pv-w2-timeline-pulse-nodes .node{ position:relative; width:12px; height:12px; border-radius:50%; background:var(--acc); flex:0 0 auto; z-index:2; }
    .pv-w2-timeline-pulse-nodes .node.pending{ background:var(--raised); border:2px solid var(--line); }
    .pv-w2-timeline-pulse-nodes .node.active{ box-shadow:0 0 0 3px var(--bg); }
    .pv-w2-timeline-pulse-nodes .ring{ position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--acc); opacity:.6; animation:pv-w2-timeline-pulse 1.8s ease-out infinite; }
    .pv-w2-timeline-pulse-nodes .text{ display:flex; flex-direction:column; gap:2px; }
    .pv-w2-timeline-pulse-nodes .text b{ font-size:12px; color:var(--head); }
    .pv-w2-timeline-pulse-nodes .text span{ font-size:10px; color:var(--mu); }
    .pv-w2-timeline-pulse-nodes .muted b{ color:var(--mu); }
    @keyframes pv-w2-timeline-pulse{ 0%{ transform:scale(1); opacity:.6; } 100%{ transform:scale(1.8); opacity:0; } }
    @media (prefers-reduced-motion: reduce){ .pv-w2-timeline-pulse-nodes .ring{ animation:none; opacity:.3; } }
  </style>
</div>

<div class="pv pv-w2-magnetic-button">
  <svg class="path" viewBox="0 0 300 180"><path d="M110 96 C 150 84, 175 66, 202 52" class="dots"/></svg>
  <div class="rest">Get started</div>
  <div class="pulled">Get started</div>
  <span class="cursor"></span>
  <style>
    .pv-w2-magnetic-button{ position:relative; width:100%; height:100%; background:var(--bg); font-family:var(--ui); }
    .pv-w2-magnetic-button .path{ position:absolute; inset:0; width:100%; height:100%; }
    .pv-w2-magnetic-button .dots{ fill:none; stroke:var(--mu); stroke-width:1.5; stroke-dasharray:1 6; stroke-linecap:round; }
    .pv-w2-magnetic-button .rest{ position:absolute; left:70px; top:80px; padding:11px 22px; border-radius:24px; border:1.5px dashed var(--line); color:var(--mu); font-size:13px; }
    /* pulled toward the cursor: offset up-right from resting position, fully filled */
    .pv-w2-magnetic-button .pulled{ position:absolute; left:158px; top:44px; padding:11px 24px; border-radius:24px; background:var(--acc); color:var(--accT); font-size:13px; font-weight:600; box-shadow:0 8px 18px color-mix(in srgb, var(--acc) 35%, transparent); }
    .pv-w2-magnetic-button .cursor{ position:absolute; left:214px; top:38px; width:8px; height:8px; border:1.5px solid var(--ink); border-radius:50%; }
  </style>
</div>

<div class="pv pv-w2-ai-inline-patterns">
  <div class="answer">
    <p>Quarterly revenue is up 12%, driven mainly by<span class="caret"></span></p>
    <div class="skeleton">
      <span class="sk w1"></span>
      <span class="sk w2"></span>
    </div>
    <span class="chip">Suggest: add revenue chart →</span>
  </div>
  <style>
    .pv-w2-ai-inline-patterns{ width:100%; height:100%; box-sizing:border-box; background:var(--bg); padding:18px; display:flex; align-items:center; }
    .pv-w2-ai-inline-patterns .answer{ width:100%; }
    .pv-w2-ai-inline-patterns p{ margin:0 0 10px; font:13px/1.55 var(--ui); color:var(--ink); }
    .pv-w2-ai-inline-patterns .caret{ display:inline-block; width:2px; height:13px; background:var(--acc); margin-left:2px; transform:translateY(2px); animation:pv-w2-ai-blink 1s steps(1) infinite; }
    @keyframes pv-w2-ai-blink{ 50%{ opacity:0; } }
    @media (prefers-reduced-motion: reduce){ .pv-w2-ai-inline-patterns .caret{ animation:none; } }
    .pv-w2-ai-inline-patterns .skeleton{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
    .pv-w2-ai-inline-patterns .sk{ height:9px; border-radius:5px; background:linear-gradient(90deg, var(--hover) 25%, var(--raised) 50%, var(--hover) 75%); background-size:200% 100%; animation:pv-w2-ai-shimmer 1.6s linear infinite; }
    @keyframes pv-w2-ai-shimmer{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }
    @media (prefers-reduced-motion: reduce){ .pv-w2-ai-inline-patterns .sk{ animation:none; background:var(--hover); } }
    .pv-w2-ai-inline-patterns .w1{ width:92%; }
    .pv-w2-ai-inline-patterns .w2{ width:64%; }
    .pv-w2-ai-inline-patterns .chip{ display:inline-block; font:11px var(--ui); color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
  </style>
</div>

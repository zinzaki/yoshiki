<div class="pv pv-w2-magnify-dock">
  <div class="dock">
    <div class="item"></div>
    <div class="item"></div>
    <div class="item big">
      <span class="tip">Messages</span>
    </div>
    <div class="item"></div>
    <div class="item"></div>
    <div class="item"></div>
  </div>
  <span class="cap">hover magnification · cursor near center</span>
  <style>
    .pv-w2-magnify-dock{ width:100%; height:100%; background:var(--bg); position:relative; display:flex; align-items:center; justify-content:center; font-family:var(--ui); box-sizing:border-box; padding:16px; }
    .pv-w2-magnify-dock .dock{ display:flex; align-items:flex-end; gap:10px; padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:20px; box-shadow:0 10px 24px rgba(0,0,0,.14); }
    .pv-w2-magnify-dock .item{ width:34px; height:34px; border-radius:11px; background:var(--raised); border:1px solid var(--line); transition:transform .15s ease; }
    .pv-w2-magnify-dock .item.big{ width:56px; height:56px; border-radius:16px; background:var(--acc); border-color:var(--acc); position:relative; box-shadow:0 8px 18px rgba(0,0,0,.18); }
    .pv-w2-magnify-dock .tip{ position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); white-space:nowrap; font-size:10px; color:var(--ink); background:var(--strong); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
    .pv-w2-magnify-dock .cap{ position:absolute; left:16px; bottom:12px; font:500 10px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--mu); }
  </style>
</div>

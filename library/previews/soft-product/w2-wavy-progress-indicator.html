      <path class="rest" d="M0 12 H300"/>

      <path class="rest" d="M0 8 H300"/>

  <style>
  .pv-w2-wavy-progress-indicator{height:100%;padding:20px;background:var(--bg);color:var(--ink);font-family:var(--ui);display:flex;flex-direction:column;gap:8px;justify-content:center}
  .pv-w2-wavy-progress-indicator .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:500;color:var(--head)}
  .pv-w2-wavy-progress-indicator .hd span{font:500 12px var(--mono);color:var(--accT)}
  .pv-w2-wavy-progress-indicator .hd.second{margin-top:14px}
  .pv-w2-wavy-progress-indicator .track{height:24px}
  .pv-w2-wavy-progress-indicator .track.slim{height:16px}
  .pv-w2-wavy-progress-indicator svg{width:100%;height:100%;overflow:visible}
  .pv-w2-wavy-progress-indicator .rest{stroke:var(--hover);stroke-width:4;stroke-linecap:round;fill:none}
  .pv-w2-wavy-progress-indicator .fill{stroke:var(--acc);stroke-width:4;stroke-linecap:round;fill:none}
  .pv-w2-wavy-progress-indicator .head{fill:var(--acc)}
  .pv-w2-wavy-progress-indicator .ft{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--mu);letter-spacing:.04em}

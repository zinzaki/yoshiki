<div class="pv pv-w2-number-ticker-stat">
  <div class="stat">
    <div class="value">
      <span class="d">4</span><span class="d">8</span>
      <span class="roll"><span class="stack"><span>2</span><span>3</span></span></span>
    </div>
    <div class="meta">
      <span class="label">Active sessions</span>
      <span class="delta">▲ 4.2% vs last hour</span>
    </div>
  </div>
  <style>
    .pv-w2-number-ticker-stat{ width:100%; height:100%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:var(--ui); }
    .pv-w2-number-ticker-stat .stat{ display:flex; flex-direction:column; gap:8px; }
    .pv-w2-number-ticker-stat .value{ display:flex; font:600 52px var(--mono); color:var(--head); line-height:1; }
    .pv-w2-number-ticker-stat .roll{ position:relative; width:0.62em; height:1em; overflow:hidden; display:inline-block; }
    /* frozen mid-roll: current digit scrolling out, next digit already peeking in */
    .pv-w2-number-ticker-stat .stack{ position:absolute; left:0; top:0; display:flex; flex-direction:column; transform:translateY(-36%); }
    .pv-w2-number-ticker-stat .stack span{ height:1em; }
    .pv-w2-number-ticker-stat .meta{ display:flex; flex-direction:column; gap:3px; }
    .pv-w2-number-ticker-stat .label{ font-size:12px; color:var(--mu); }
    .pv-w2-number-ticker-stat .delta{ font:600 11px var(--mono); color:var(--acc); }
  </style>
</div>

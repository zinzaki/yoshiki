<div class="pv pv-w2-scroll-progress-ring-fab">
  <div class="fab">
    <svg viewBox="0 0 64 64" width="60" height="60">
      <circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="4"></circle>
      <circle class="prog" cx="32" cy="32" r="27" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="64.4" transform="rotate(-90 32 32)"></circle>
    </svg>
    <span class="arrow">↑</span>
  </div>
  <span class="pct">62%</span>
  <style>
    .pv-w2-scroll-progress-ring-fab{ position:relative; width:100%; height:100%; box-sizing:border-box; background:var(--bg); display:flex; align-items:center; justify-content:center; }
    .pv-w2-scroll-progress-ring-fab .fab{ position:relative; width:60px; height:60px; border-radius:50%; background:var(--raised); box-shadow:0 10px 22px -8px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
    .pv-w2-scroll-progress-ring-fab .fab svg{ position:absolute; inset:0; }
    .pv-w2-scroll-progress-ring-fab .arrow{ position:relative; font:600 18px var(--ui); color:var(--ink); }
    .pv-w2-scroll-progress-ring-fab .pct{ position:absolute; right:22px; bottom:26px; font:10px var(--mono); color:var(--mu); background:var(--panel); border:1px solid var(--line); padding:2px 6px; border-radius:6px; }
  </style>
</div>

  action.tint: kin-1 @6%
  action.hover.edge: kin-0
  ok.text: mori-0
  ok.fill: mori-1
  ok.on-fill: shiro
  ok.wash: mori-w
  warn.text: kaki-1
  danger.text: aka-0

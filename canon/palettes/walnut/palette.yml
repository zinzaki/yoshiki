  danger.wash: aka-w
  info.text: kin-1
  special.text: fuji-1
  effect.glass: ink-2
  effect.sheen: bone-0
  focus.ring: kin-1 @40%
  selection.bg: kin-1 @22%
  syntax.keyword: syn-keyword
  syntax.function: syn-function
  syntax.string: syn-string
  syntax.number: syn-number
  syntax.type: syn-type
  syntax.constant: syn-number
  syntax.comment: syn-comment

groups:
- key: surface
  label: lacquer
  note: the quiet ~70% that carries a screen — warm, never grey
  steps:
  - token: ink-0
    job: app · terminal background
  - token: ink-1
    job: panel surface
  - token: ink-2
    job: raised — cards
    tiles: null
  - token: ink-3
    job: hover · active · inset
- key: line
  label: gilding
  note: gold-tinted edges — an edge needs 3:1, never 4.5
  steps:
  - token: line-0
    job: hairline — the default divider
  - token: line-1
    job: strong border — inputs
    frames: null
- key: bone
  label: bone
  note: text, never pure white — the warm off-white of aged paper
  steps:
  - token: bone-0
    job: heading · emphasis
  - token: bone-1
    job: body text
  - token: bone-2
    job: secondary
  - token: bone-3
    job: muted · metadata
  - token: bone-4
    job: ghost · disabled
- key: kin
  label: gold
  note: the seam — line, edge, frame, glyph. Never a filled slab.
  steps:
  - token: kin-0
    job: glow — hover edge
  - token: kin-1
    job: GOLD — action
    link: null
    cursor: null
  - token: kin-t
    job: text-safe gold on paper (washi only)
    optional: true
  - token: kin-2
    job: dim gold — labels
    glyphs: null
  - token: kin-3
    job: deep gold
  - token: kin-w
    job: wash — selection
    tint fills: null
- key: kaki
  label: persimmon
  note: warning — the lamp, not the alarm
  steps:
  - token: kaki-1
    job: warning · lamp · threshold crossed
- key: aka
  label: scarlet
  note: the bloom — the irreversible. One per screen; it may fill.
  steps:
  - token: aka-0
    job: text-safe scarlet
  - token: aka-1
    job: SPIDER LILY — the trigger
    may fill: null
  - token: aka-2
    job: red lacquer — pressed
  - token: aka-w
    job: wash — error field
    diff-del: null
  - token: sabi
    job: dusty rust — calm red contexts
- key: mori
  label: moss
  note: life, growth, confirmation — the quiet pair of scarlet
  steps:
  - token: mori-0
    job: text-safe moss
  - token: mori-1
    job: MOSS — success
    may fill: null
  - token: mori-2
    job: pine depth
  - token: mori-w
    job: wash — diff-add
- key: onfill
  label: on-fill
  note: the only pure white — a label on a filled trigger, where legibility outranks
    warmth
  steps:
  - token: shiro
    job: text on danger.fill · ok.fill
- key: paper
  label: paper
  note: the paper artifact pinned inside the dark — and inverted on paper
  steps:
  - token: washi-bg
    job: artifact surface
  - token: washi-ink
    job: artifact text
  - token: washi-line
    job: artifact rule
- key: service
  label: service
  note: terminal ANSI and syntax ONLY — these hues never enter the UI
  steps:
  - token: hotaru-0
    job: bright blue
  - token: hotaru-1
    job: ansi blue · types
  - token: hotaru-2
    job: deep blue
  - token: fuji-0
    job: bright wisteria
  - token: fuji-1
    job: ansi magenta · constants
  - token: fuji-2
    job: deep wisteria
  - token: seiji-0
    job: bright celadon
  - token: seiji-1
    job: ansi cyan · live data
  - token: seiji-2
    job: deep celadon
  - token: shin-2
    job: deep water — optional second darkness
  - token: shin-3
    job: deepest water
- key: syntax
  label: syntax
  note: 'editor colours — warm bright: coral, gold, olive, amber, dry olive; no blue
    or pink'
  steps:
  - token: syn-keyword
    job: keyword · control flow
  - token: syn-function
    job: function · the action
  - token: syn-string
    job: string · content
  - token: syn-number
    job: number · constant
  - token: syn-type
    job: type · shape of data
  - token: syn-comment
    job: comment
